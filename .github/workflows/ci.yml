# Checks every pull request (and main) before it can reach production.
# Make "App checks" and "Database checks" required in GitHub branch protection for main.
# See docs/release-process.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Migration rules
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: node scripts/check-migrations.mjs

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

  database:
    name: Database checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts a throwaway local Supabase, applies every migration from an empty database,
      # then loads seed.sql. A migration that can't apply cleanly fails here, not in production.
      # Clear any leftover containers/ports first — a prior partial start can leave :54322 bound
      # and fail with "address already in use" even though this job changed no SQL.
      - name: Start local Supabase and apply migrations
        run: |
          supabase stop --no-backup || true
          docker ps -aq --filter "name=supabase" | xargs -r docker rm -f || true
          for port in 54320 54321 54322 54323 54324 54327 54329; do
            fuser -k "${port}/tcp" 2>/dev/null || true
          done
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,inbucket

      - name: Tenancy and subscription tests (pgTAP)
        run: supabase test db

      - name: Stop
        if: always()
        run: supabase stop --no-backup
